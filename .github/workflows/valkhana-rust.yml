name: ValKhana Rust

on:
  push:
    branches: [main, production, architecture/valkhana-v1.3.3]
  pull_request:
    branches: [main, production]

permissions:
  contents: read

jobs:
  rust:
    name: Rust 1.88 workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # Tauri validates externalBin during cargo build. The executable is
      # intentionally ignored because it is generated from the checked-in web
      # server source, so create it in every clean CI checkout.
      - name: Prepare Tauri sidecar
        run: pnpm tauri:prepare

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
