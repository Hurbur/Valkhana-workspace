[package]
name = "valkhana-desktop"
version = "0.1.0"
description = "ValKhana desktop control-plane interface"
license.workspace = true
edition.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "valkhana_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow.workspace = true
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
valkhana-api = { path = "../crates/valkhana-api" }
valkhana-config = { path = "../crates/valkhana-config" }
valkhana-domain = { path = "../crates/valkhana-domain" }
valkhana-secrets = { path = "../crates/valkhana-secrets" }
tauri-plugin-shell = "2"
tokio.workspace = true
getrandom = "0.3"
